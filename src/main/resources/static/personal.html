<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>El meu espai – Tenda JOAM</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONES -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- CSS PERSONAL -->
    <link rel="stylesheet" href="css/styles-origin.css">
    <link rel="stylesheet" href="css/styles-personal.css">
</head>

<body>

<!-- CONTINGUT -->
<div class="container">

    <h2 class="mb-4">El meu espai personal</h2>

    <!-- INFO USUARI -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title mb-3"><i class="fa-solid fa-user me-2"></i>Les meves dades</h4>
            <p><strong>Nom:</strong> <span id="userNom"></span></p>
            <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <p><strong>Rol:</strong> <span id="userRol"></span></p>
        </div>
    </div>

    <!-- CARRO -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3"><i class="fa-solid fa-cart-shopping me-2"></i>El meu carro</h4>

            <div id="carroBuit" class="text-muted">Encara no tens productes al carro.</div>

            <ul id="llistaCarro" class="list-group"></ul>

            <div class="mt-3 text-end fw-bold fs-5" id="totalCarro"></div>
            
            <button id="btnComprar" class="btn btn-success w-100 mt-3">
			    <i class="fa-solid fa-credit-card me-2"></i> Comprar
			</button>
            
        </div>
    </div>

</div>

<!-- JS PERSONAL -->
<script src="js/js-personal.js"></script>
<script src="js/js-navbar.js"></script>


</body>
</html>
