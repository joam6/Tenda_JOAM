<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Tenda JOAM - Registrar-se</title>
<link rel="icon" type="image/png" href="img/logo.png">
<!-- BOOTSTRAP -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- CSS PERSONAL -->
<link rel="stylesheet" href="css/styles-origin.css">
<link rel="stylesheet" href="css/styles-register.css">
</head>

<body>

	<script src="js/js-navbar.js"></script>
	

	<div class="d-flex justify-content-center align-items-center vh-100">
		<div class="card p-4 shadow" style="width: 380px;">
			<h3 class="text-center mb-3">📝 Crear un compte</h3>

			<form id="registerForm">
				<div class="mb-3">
					<label class="form-label">Nom complet</label> <input id="nom"
						type="text" class="form-control" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Email</label> <input id="email"
						type="email" class="form-control" required>
				</div>

				<div class="mb-3">
					<label class="form-label">Contrasenya</label> <input id="password"
						type="password" class="form-control" required>
				</div>

				<button class="btn btn-success w-100 mb-2">Registrar-se</button>
			</form>

			<button class="btn btn-outline-secondary w-100"
				onclick="window.location.href='/login'">Ja tens un
				compte? Inicia sessió</button>

			<p id="error" class="text-danger mt-3 text-center"></p>
			<p id="success" class="text-success mt-3 text-center"></p>
		</div>
	</div>

	<script src="js/js-register.js"></script>
	<!-- FOOTER -->
	<div id="footer-container"></div>
	<script src="js/js-footer.js"></script>
</body>


</html>
