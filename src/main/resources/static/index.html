<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Tenda JOAM</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
	rel="stylesheet">

<link rel="stylesheet" href="css/styles-origin.css">
<link rel="stylesheet" href="css/styles-main.css">
</head>

<body>

	<div class="container main-container">
		<h2 class="mt-3 mb-4 text-center">Productes disponibles</h2>

		<div id="categoryFilter"
			class="d-flex justify-content-center gap-2 mb-4 flex-wrap"></div>

		<div id="vendorFilterAlert" class="text-center mb-4" style="display: none;">
			<div class="d-inline-flex align-items-center gap-2 p-2 px-3 rounded shadow-sm" style="background-color: var(--color-card-bg); color: var(--color-text);">
				<span>Mostrant productes de: <strong id="activeVendorName" style="color: var(--color-primary);"></strong></span>
				<button class="btn btn-sm btn-outline-danger ms-2" onclick="netejarFiltreVenedor()">
					<i class="fa-solid fa-xmark"></i> Treure filtre
				</button>
			</div>
		</div>

		<div id="toastContainer" class="position-fixed bottom-0 end-0 p-3"
			style="z-index: 1055;"></div>
		<div id="productes" class="row g-4"></div>
		<div class="text-center mt-4">
			<button id="loadMoreBtn" class="btn btn-secondary px-4 py-2">
				Mostrar més</button>
		</div>
	</div>

	<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content" style="background-color: var(--color-card-bg); color: var(--color-text); border: none; border-radius: 10px;">
				<div class="modal-header" style="border-bottom: 1px solid var(--navbar-btn-border);">
					<h5 class="modal-title" id="modalProductTitle" style="font-weight: 700;"></h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-md-6 text-center mb-3 mb-md-0">
							<img id="modalProductImg" src="" alt="" class="img-fluid rounded" style="max-height: 350px; object-fit: contain;">
						</div>
						<div class="col-md-6 d-flex flex-column justify-content-between">
							<div>
								<h4 id="modalProductPrice" class="mb-1" style="color: var(--color-primary); font-weight: 600;"></h4>
								
								<p class="mb-3">
									<span style="opacity: 0.7;">Venedor:</span> 
									<a id="modalProductVendor" href="#" style="color: var(--color-primary); font-weight: 600; text-decoration: none;"></a>
								</p>
								
								<p id="modalProductDescription" style="opacity: 0.9;"></p>
							</div>
							<div class="mt-3">
								<button id="modalAddToCartBtn" class="btn btn-success w-100" style="font-weight: 600; background-color: var(--color-success); border-color: var(--color-success);">
									<i class="fa-solid fa-cart-shopping me-2"></i> Afegir al carret
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script src="js/js-main.js"></script>

	<script src="js/js-navbar.js"></script>

	<div id="footer-container"></div>
	<script src="js/js-footer.js"></script>

</body>
</html>
